[package]
name = "pechka"
version = "0.10.0"
description = "TUI для серверов Minecraft: консоль, логи, RCON, бэкапы, авто-рестарт"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
md-5 = "0.11.0"
minisign-verify = "0.3.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sys-locale = "0.3.2"
sysinfo = "0.40.3"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
